name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test_gen.mjs
      - run: node tests/test_sim.mjs
