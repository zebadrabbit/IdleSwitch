<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdleSwitch</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="src/style.css?v=3"> <!-- bump v when style.css changes: the host caches css for 7 days and ignores our .htaccess -->
</head>
<body>
<canvas id="map"></canvas>
<header id="hud">
  <a class="wordmark" href="./" title="IdleSwitch"><img class="full" src="assets/logo-hud.svg" alt="IdleSwitch"><img class="glyph" src="assets/logo-glyph.svg" alt="IdleSwitch"></a>
  <span id="hud-clock"></span>
  <span id="hud-sky" title="lighting"><i class="sun">☀</i><i class="moon">☾</i></span>
  <button id="btn-pause" title="pause / resume (Space)">⏸</button>
  <button id="btn-speed" title="sim speed (+ / −)">1×</button>
  <button id="hud-auto" title="AUTO / MANUAL (A)">AUTO</button>
  <span id="hud-operator" class="dim"></span>
  <button id="hud-seed" title="seed: load, new or copy"></button>
  <select id="hud-density" title="traffic density"></select>
  <span class="spacer"></span>
  <button data-panel="board" title="train board (1)">Board</button>
  <button data-panel="log" title="log (2)">Log</button>
  <button data-panel="inspector" title="inspector (3)">Inspector</button>
  <button data-panel="legend" title="legend and keys (4)">Legend</button>
  <button data-panel="settings" title="settings (5)">Settings</button>
  <button data-panel="about" title="about IdleSwitch (?)">?</button>
  <button id="btn-fullscreen" title="fullscreen">⛶</button>
  <button id="btn-zoom-out" title="zoom out">−</button><button id="btn-zoom-in" title="zoom in">+</button><button id="btn-fit" title="reset view (F, 0)">⌖</button>
</header>
<div id="docks">
  <div id="dock-left"><div class="dock-handle" data-dock="left"></div></div>
  <div id="dock-center"></div>
  <div id="dock-right"><div class="dock-handle" data-dock="right"></div></div>
  <div id="dock-bottom"><div class="dock-handle" data-dock="bottom"></div></div>
</div>
<section class="panel" id="panel-board"><div class="panel-title">Board <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-log"><div class="panel-title">Log <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-inspector"><div class="panel-title">Inspector <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-legend"><div class="panel-title">Legend <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-about"><div class="panel-title">About <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-settings"><div class="panel-title">Settings <button class="panel-hide" title="hide">×</button></div><div class="panel-body"></div></section>
<div id="seed-pop" class="panel hidden"><div class="panel-body"><input name="seed" spellcheck="false" autocomplete="off"> <button data-act="load">Load</button> <button data-act="new">New seed</button> <button data-act="copy">Copy</button></div></div>
<script type="module" src="src/ui.js"></script>
</body>
</html>
