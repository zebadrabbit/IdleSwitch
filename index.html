<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdleSwitch</title>
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="map"></canvas>
<header id="hud">
  <span class="wordmark">IdleSwitch</span>
  <span id="hud-clock"></span>
  <button id="btn-pause" title="pause/resume">⏸</button>
  <button id="btn-speed" title="sim speed">1x</button>
  <span id="hud-auto"></span>
  <span id="hud-seed"></span>
  <span class="spacer"></span>
  <button data-panel="board">Board</button>
  <button data-panel="log">Log</button>
  <button data-panel="inspector">Inspector</button>
  <button data-panel="legend">Legend</button>
  <button data-panel="settings">Settings</button>
  <button id="btn-fullscreen" title="fullscreen">⛶</button>
</header>
<section class="panel" id="panel-board"><div class="panel-title">Board <button class="panel-hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-log"><div class="panel-title">Log <button class="panel-hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-inspector"><div class="panel-title">Inspector <button class="panel-hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-legend"><div class="panel-title">Legend <button class="panel-hide">×</button></div><div class="panel-body"></div></section>
<section class="panel" id="panel-settings"><div class="panel-title">Settings <button class="panel-hide">×</button></div><div class="panel-body"></div></section>
<script type="module" src="src/ui.js"></script>
</body>
</html>
